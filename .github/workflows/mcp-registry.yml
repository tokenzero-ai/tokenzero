# Publishes the TokenZero MCP server (sh.tokenzero/mcp, the name in mcp/server.json) to the official
# MCP Registry (registry.modelcontextprotocol.io) after each release's npm publish, or by hand.
#
# Authentication: HTTP domain verification for the sh.tokenzero/* namespace. The registry fetches
# https://tokenzero.sh/.well-known/mcp-registry-auth and expects a signature from the matching
# Ed25519 private key, stored in the MCP_PRIVATE_KEY repository secret. One registry name only:
# GitHub OIDC is deliberately not used, since it can only authorise io.github.<owner>/* names.
# Runs after the npm release workflow (npm-release.yml) succeeds: the registry checks that the
# version in server.json exists on npm.
name: Publish to MCP Registry

on:
  workflow_run:
    workflows: ["Publish npm packages"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (defaults to the version in mcp/server.json)"
        required: false

permissions:
  contents: read

jobs:
  publish:
    # Only after a successful npm publish (or a manual run).
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --version || true

      - name: Prepare server.json
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_VERSION:-}"
          cp mcp/server.json server.json
          if [ -n "$VERSION" ]; then
            jq --arg v "$VERSION" '.version = $v | (.packages // []) |= map(.version = $v)' server.json > server.tmp && mv server.tmp server.json
          fi
          test "$(jq -r .name server.json)" = "sh.tokenzero/mcp"
          echo "Publishing $(jq -r .name server.json) $(jq -r .version server.json) via HTTP domain verification"

      - name: Authenticate (HTTP domain verification for sh.tokenzero)
        run: ./mcp-publisher login http --domain tokenzero.sh --private-key "${{ secrets.MCP_PRIVATE_KEY }}"

      - name: Publish to the MCP Registry
        run: ./mcp-publisher publish

      - name: Confirm listing
        run: |
          curl -sS "https://registry.modelcontextprotocol.io/v0.1/servers?search=sh.tokenzero%2Fmcp&version=latest" | head -c 2000; echo
